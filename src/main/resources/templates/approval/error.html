<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content" class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 text-center">
            <th:block th:replace="~{fragments/logo :: auth-header}"/>
            <h2 class="h5 text-danger mb-3">Approval link invalid</h2>
            <p class="mb-0" th:text="${message}">This approval link is invalid or has already been used.</p>
            <a th:href="@{/login}" class="btn btn-outline-primary mt-4">Go to login</a>
        </div>
    </div>
</section>
</body>
</html>
