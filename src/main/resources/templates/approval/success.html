<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content" class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 text-center">
            <th:block th:replace="~{fragments/logo :: auth-header}"/>
            <h2 class="h5 text-success mb-3">Account approved</h2>
            <p class="mb-0">
                <strong th:text="${username}">user</strong> can now sign in to IB Farms.
            </p>
            <a th:href="@{/login}" class="btn btn-primary mt-4">Go to login</a>
        </div>
    </div>
</section>
</body>
</html>
