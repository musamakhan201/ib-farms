<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content">
    <th:block th:replace="~{fragments/toolbar :: toolbar('Other Expenses', @{/other-expenses/new}, 'Add Expense')}"/>
    <p class="text-muted small mb-3">Farm-wide costs (utilities, equipment, rent, etc.) — included in profit/loss reports.</p>

    <div class="ib-mobile-list d-md-none" th:if="${!expenses.isEmpty()}">
        <article class="ib-mobile-card" th:each="e : ${expenses}">
            <div class="ib-mobile-card-row">
                <span class="ib-mobile-card-label">Date</span>
                <span th:text="${e.expenseDate}"></span>
            </div>
            <div class="ib-mobile-card-row">
                <span class="ib-mobile-card-label">Category</span>
                <span th:text="${e.category}"></span>
            </div>
            <div class="ib-mobile-card-row">
                <span class="ib-mobile-card-label">Amount</span>
                <strong th:text="${#numbers.formatDecimal(e.amount, 1, 2)}"></strong>
            </div>
            <p class="small text-muted mb-2" th:text="${e.description != null ? e.description : '—'}"></p>
            <form th:action="@{/other-expenses/{id}/delete(id=${e.id})}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger w-100">Delete</button>
            </form>
        </article>
    </div>
    <div class="card d-md-none" th:if="${expenses.isEmpty()}">
        <div class="card-body text-center text-muted py-4">No other expenses yet.</div>
    </div>

    <div class="card d-none d-md-block">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${expenses}">
                    <td th:text="${e.expenseDate}"></td>
                    <td th:text="${e.category}"></td>
                    <td th:text="${#numbers.formatDecimal(e.amount, 1, 2)}"></td>
                    <td th:text="${e.description != null ? e.description : '—'}"></td>
                    <td class="text-end">
                        <form th:action="@{/other-expenses/{id}/delete(id=${e.id})}" method="post" class="d-inline">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${expenses.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">No other expenses yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
