<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content">
<div class="card p-4 col-lg-6">
        <form th:action="@{/other-expenses}" th:object="${expense}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Date *</label>
                <input type="date" th:field="*{expenseDate}" class="form-control"/>
                <div class="invalid-feedback d-block" th:errors="*{expenseDate}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Category *</label>
                <input type="text" th:field="*{category}" class="form-control" list="otherCategories"/>
                <datalist id="otherCategories">
                    <option value="Utilities"></option>
                    <option value="Equipment"></option>
                    <option value="Rent"></option>
                    <option value="Maintenance"></option>
                    <option value="Transport"></option>
                    <option value="Insurance"></option>
                    <option value="Supplies"></option>
                </datalist>
            </div>
            <div class="mb-3">
                <label class="form-label">Amount *</label>
                <input type="number" step="0.01" th:field="*{amount}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/other-expenses}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
