<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content" class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <th:block th:replace="~{fragments/logo :: auth-header}"/>
            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
            <div th:if="${param.pending}" class="alert alert-warning">Your account is waiting for admin approval. You can sign in after approval.</div>
            <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <p class="text-center mt-3 mb-0">
                <a th:href="@{/register}">Create an account</a>
            </p>
        </div>
        <th:block th:replace="~{fragments/logo :: footer}"/>
    </div>
</section>
</body>
</html>
