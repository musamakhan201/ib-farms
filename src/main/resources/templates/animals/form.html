<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{::#scripts})}">
<body>
<section id="content">
    <div class="mb-4">
    </div>
    <div class="card p-4">
        <form th:action="${isEdit} ? @{/animals/{id}(id=${animal.id})} : @{/animals}"
              th:object="${animal}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tag Number *</label>
                    <input type="text" th:field="*{tagNumber}" class="form-control" th:classappend="${#fields.hasErrors('tagNumber')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{tagNumber}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Species *</label>
                    <input type="text" th:field="*{species}" class="form-control" list="speciesList" th:classappend="${#fields.hasErrors('species')} ? 'is-invalid'"/>
                    <datalist id="speciesList">
                        <option value="Cow"></option>
                        <option value="Goat"></option>
                        <option value="Sheep"></option>
                        <option value="Buffalo"></option>
                    </datalist>
                    <div class="invalid-feedback" th:errors="*{species}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Breed</label>
                    <input type="text" th:field="*{breed}" class="form-control"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Picture</label>
                    <input type="file" name="picture" class="form-control" accept="image/*"/>
                    <div th:if="${animal.existingPictureFilename}" class="mt-2">
                        <img th:src="${@imageUrl.url(animal.existingPictureFilename)}" class="animal-thumb" alt="Current"/>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Purchase Price *</label>
                    <input type="number" step="0.01" th:field="*{purchasePrice}" class="form-control" th:classappend="${#fields.hasErrors('purchasePrice')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{purchasePrice}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Purchase Date *</label>
                    <input type="date" th:field="*{purchaseDate}" class="form-control" th:classappend="${#fields.hasErrors('purchaseDate')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{purchaseDate}"></div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" th:field="*{pregnant}" class="form-check-input" id="pregnantCheck"/>
                        <label class="form-check-label" for="pregnantCheck">Pregnant</label>
                    </div>
                </div>
                <div class="col-md-4" id="pregnancyDateGroup">
                    <label class="form-label">Pregnancy Date</label>
                    <input type="date" th:field="*{pregnancyDate}" class="form-control" id="pregnancyDate"/>
                    <small class="text-muted">Expected delivery = pregnancy date + 283 days</small>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top" id="growthSection" th:if="${!isEdit}">
                <div class="form-check mb-3">
                    <input type="checkbox" th:field="*{recordInitialGrowth}" class="form-check-input" id="growthCheck"/>
                    <label class="form-check-label fw-semibold" for="growthCheck">Record initial growth measurements</label>
                </div>
                <div id="growthFields" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Growth Record Date</label>
                        <input type="date" th:field="*{growthRecordDate}" class="form-control"/>
                        <small class="text-muted">Defaults to purchase date if empty</small>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Height (cm)</label>
                        <input type="number" step="0.01" th:field="*{growthHeightCm}" class="form-control"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Length (cm)</label>
                        <input type="number" step="0.01" th:field="*{growthLengthCm}" class="form-control"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Weight (kg)</label>
                        <input type="number" step="0.01" th:field="*{growthWeightKg}" class="form-control"/>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Growth Notes</label>
                        <input type="text" th:field="*{growthNotes}" class="form-control" placeholder="Optional"/>
                    </div>
                    <div class="col-12">
                        <small class="text-muted">At least one measurement (height, length, or weight) is required when recording growth.</small>
                    </div>
                </div>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger mt-3" th:text="${errorMessage}"></div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/animals}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
<th:block id="scripts" th:fragment="scripts">
    <script>
        const pregnantCheck = document.getElementById('pregnantCheck');
        const pregnancyGroup = document.getElementById('pregnancyDateGroup');
        function togglePregnancy() { pregnancyGroup.style.display = pregnantCheck.checked ? 'block' : 'none'; }
        pregnantCheck.addEventListener('change', togglePregnancy);
        togglePregnancy();

        const growthCheck = document.getElementById('growthCheck');
        const growthFields = document.getElementById('growthFields');
        if (growthCheck && growthFields) {
            function toggleGrowth() { growthFields.style.display = growthCheck.checked ? 'flex' : 'none'; }
            growthFields.style.display = 'none';
            growthFields.classList.add('row', 'g-3');
            growthCheck.addEventListener('change', toggleGrowth);
            toggleGrowth();
        }
    </script>
</th:block>
</body>
</html>
