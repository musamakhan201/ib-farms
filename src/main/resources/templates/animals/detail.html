<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{::#scripts})}">
<body>
<section id="content">
    <div class="ib-detail-header mb-4">
        <div class="ib-detail-title">
            <img th:src="@{/images/ib-farms-logo.png}" alt="" class="ib-logo ib-logo-page" aria-hidden="true"/>
            <div class="min-w-0">
                <h1 class="h3 mb-1 text-truncate" th:text="${animal.name}"></h1>
                <span class="text-muted" th:text="${animal.tagNumber} + ' · ' + ${animal.species}"></span>
            </div>
        </div>
        <div class="ib-detail-actions" th:if="${animal.status.name() == 'ACTIVE'}">
            <a th:href="@{/animals/{id}/edit(id=${animal.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
            <a th:href="@{/animals/{id}/growth/new(id=${animal.id})}" class="btn btn-outline-primary btn-sm">Growth</a>
            <a th:href="@{/animals/{id}/expenses/new(id=${animal.id})}" class="btn btn-outline-primary btn-sm">Expense</a>
            <a th:href="@{/animals/{id}/sell(id=${animal.id})}" class="btn btn-warning btn-sm">Sell Animal</a>
            <form th:action="@{/animals/{id}/delete(id=${animal.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Delete this animal?');">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
            </form>
        </div>
        <div class="ib-detail-actions" th:if="${animal.status.name() == 'SOLD'}">
            <a th:href="@{/animals/{id}/sale/report(id=${animal.id})}" class="btn btn-success btn-sm">Sale Report</a>
            <a th:href="@{/animals/{id}/sale/report/download(id=${animal.id})}" class="btn btn-primary btn-sm">Download PDF</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card p-3">
                <img th:if="${animal.pictureFilename}" th:src="${animal.pictureFilename}"
                     class="img-fluid animal-detail-img w-100 mb-3" alt=""/>
                <dl class="row mb-0 small">
                    <dt class="col-5">Breed</dt><dd class="col-7" th:text="${animal.breed ?: '-'}"></dd>
                    <dt class="col-5">Purchase</dt><dd class="col-7" th:text="${#numbers.formatDecimal(animal.purchasePrice, 1, 2)}"></dd>
                    <dt class="col-5">Purchase Date</dt><dd class="col-7" th:text="${animal.purchaseDate}"></dd>
                    <dt class="col-5">Status</dt><dd class="col-7" th:text="${animal.status}"></dd>
                    <dt class="col-5">Total Expenses</dt><dd class="col-7" th:text="${#numbers.formatDecimal(animal.totalExpenses, 1, 2)}"></dd>
                    <dt class="col-5" th:if="${animal.pregnant}">Pregnancy</dt>
                    <dd class="col-7" th:if="${animal.pregnant}">
                        <span th:text="${animal.pregnancyDate}"></span><br/>
                        <small>EDD: <span th:text="${animal.expectedDeliveryDate}"></span> (+283 days)</small>
                    </dd>
                    <dt class="col-5" th:if="${animal.sale != null}">Profit</dt>
                    <dd class="col-7" th:if="${animal.sale != null}" th:text="${#numbers.formatDecimal(animal.profit, 1, 2)}"></dd>
                </dl>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card p-3 mb-4" th:if="${animal.sale != null}">
                <h5>Sale Record</h5>
                <p class="mb-0">
                    Sold on <span th:text="${animal.sale.saleDate}"></span> for
                    <strong th:text="${#numbers.formatDecimal(animal.sale.salePrice, 1, 2)}"></strong>
                    <span th:if="${animal.sale.buyerName}"> to <span th:text="${animal.sale.buyerName}"></span></span>
                </p>
            </div>

            <div class="card p-3 mb-4">
                <h5>Growth Records</h5>
                <div class="ib-chart-wrap" th:if="${!animal.growthRecords.isEmpty()}">
                    <canvas id="growthChart"></canvas>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table table-sm">
                        <thead><tr><th>Date</th><th>Height</th><th>Length</th><th>Weight</th></tr></thead>
                        <tbody>
                        <tr th:each="g : ${animal.growthRecords}">
                            <td th:text="${g.recordDate}"></td>
                            <td th:text="${g.heightCm != null ? g.heightCm + ' cm' : '-'}"></td>
                            <td th:text="${g.lengthCm != null ? g.lengthCm + ' cm' : '-'}"></td>
                            <td th:text="${g.weightKg != null ? g.weightKg + ' kg' : '-'}"></td>
                        </tr>
                        <tr th:if="${animal.growthRecords.isEmpty()}"><td colspan="4" class="text-muted">No records.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card p-3">
                <h5>Expenses</h5>
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th></tr></thead>
                        <tbody>
                        <tr th:each="e : ${animal.expenses}">
                            <td th:text="${e.expenseDate}"></td>
                            <td th:text="${e.category}"></td>
                            <td th:text="${#numbers.formatDecimal(e.amount, 1, 2)}"></td>
                            <td th:text="${e.description ?: '-'}"></td>
                        </tr>
                        <tr th:if="${animal.expenses.isEmpty()}"><td colspan="4" class="text-muted">No expenses.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
<th:block id="scripts" th:fragment="scripts" th:if="${!animal.growthRecords.isEmpty()}">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof Chart === 'undefined') {
                return;
            }
            const records = /*[(${@json.write(animal.growthRecords)})]*/ [];
            const labels = records.map(r => r.recordDate).reverse();
            const weights = records.map(r => r.weightKg != null ? Number(r.weightKg) : null).reverse();
            if (labels.length && weights.some(w => w != null)) {
                new Chart(document.getElementById('growthChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{label: 'Weight (kg)', data: weights, borderColor: '#1b4332', tension: 0.3}]
                    },
                    options: {responsive: true, maintainAspectRatio: false}
                });
            }
        });
    </script>
</th:block>
</body>
</html>
