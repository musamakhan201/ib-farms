<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content">
    <div class="mb-4"><p class="text-muted mb-0" th:text="${employee.fullName}"></p>
    </div>
    <div class="card p-4 col-lg-6">
        <form th:action="@{/employees/{id}/salaries(id=${employee.id})}" th:object="${salary}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label">Salary Year *</label>
                    <input type="number" th:field="*{salaryYear}" class="form-control" min="2000" max="2100"/>
                    <div class="invalid-feedback d-block" th:errors="*{salaryYear}"></div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Salary Month *</label>
                    <select th:field="*{salaryMonth}" class="form-select">
                        <option value="1">January</option><option value="2">February</option><option value="3">March</option>
                        <option value="4">April</option><option value="5">May</option><option value="6">June</option>
                        <option value="7">July</option><option value="8">August</option><option value="9">September</option>
                        <option value="10">October</option><option value="11">November</option><option value="12">December</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Amount Paid *</label>
                    <input type="number" step="0.01" th:field="*{amount}" class="form-control"/>
                    <div class="invalid-feedback d-block" th:errors="*{amount}"></div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Paid Date *</label>
                    <input type="date" th:field="*{paidDate}" class="form-control"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea th:field="*{notes}" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger mt-3" th:text="${errorMessage}"></div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Payment</button>
                <a th:href="@{/employees/{id}(id=${employee.id})}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
