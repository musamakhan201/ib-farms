<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content">
    <div class="mb-4">
    </div>
    <div class="card p-4 col-lg-7">
        <form th:action="${isEdit} ? @{/employees/{id}(id=${employee.id})} : @{/employees}" th:object="${employee}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label">Role</label>
                    <input type="text" th:field="*{role}" class="form-control" placeholder="e.g. Farm hand"/>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control"/>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Monthly Salary</label>
                    <input type="number" step="0.01" th:field="*{monthlySalary}" class="form-control"/>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Hire Date</label>
                    <input type="date" th:field="*{hireDate}" class="form-control"/>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck"/>
                        <label class="form-check-label" for="activeCheck">Active employee</label>
                    </div>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/employees}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
