<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::#content}, ~{})}">
<body>
<section id="content">
    <div class="mb-4"><p class="text-muted mb-0 ms-5 ps-4" th:text="${animal.name} + ' (' + ${animal.tagNumber} + ')'"></p>
    </div>
    <div class="card p-4 col-lg-6">
        <form th:action="@{/animals/{id}/growth(id=${animal.id})}" th:object="${growth}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Record Date *</label>
                <input type="date" th:field="*{recordDate}" class="form-control" required/>
                <div class="invalid-feedback d-block" th:errors="*{recordDate}"></div>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Height (cm)</label>
                    <input type="number" step="0.01" th:field="*{heightCm}" class="form-control"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Length (cm)</label>
                    <input type="number" step="0.01" th:field="*{lengthCm}" class="form-control"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" step="0.01" th:field="*{weightKg}" class="form-control"/>
                </div>
            </div>
            <div class="mb-3 mt-3">
                <label class="form-label">Notes</label>
                <textarea th:field="*{notes}" class="form-control" rows="2"></textarea>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/animals/{id}(id=${animal.id})}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</section>
</body>
</html>
