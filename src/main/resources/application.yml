spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: ib-farms
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  sql:
    init:
      mode: never
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
  folder: ib-farms/animals

logging:
  level:
    com.ibfarms: INFO
    org.springframework.security: WARN
