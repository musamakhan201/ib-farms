spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: ib-farms
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

ibfarms:
  admin-email: ${IBFARMS_ADMIN_EMAIL:musamakhan201@gmail.com}
  base-url: ${IBFARMS_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:10000}}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
  folder: ib-farms/animals

logging:
  level:
    com.ibfarms: INFO
    org.springframework.security: WARN
